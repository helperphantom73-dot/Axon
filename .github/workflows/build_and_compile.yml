name: Auto Axon Compiler & Multi-Strategy Builder

# به محض ذخیره (Push) یا Pull Request، کامپایل خودکار شروع می‌شود
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # امکان اجرای دستی با یک دکمه در گیت‌هاب

jobs:
  build-and-bake:
    name: Multi-Strategy Fallback Compilation
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 3. Install System Toolchain (GCC, Clang, LLVM)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential clang llvm-dev libffi-dev

    - name: 4. Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # نصب llvmlite با fallback در صورت بروز مشکل
        pip install llvmlite || pip install --no-binary llvmlite llvmlite

    - name: 5. Unpack Repository (if axon_bundle.py is used)
      run: |
        if [ -f "axon_bundle.py" ] && [ ! -d "axon" ]; then
          echo "Found bundle script. Generating file tree..."
          python3 axon_bundle.py || true
        fi

    - name: 6. Multi-Strategy Compilation & Fallback Engine
      id: compile_step
      run: |
        set +e # غیرفعال کردن توقف آنی برای مدیریت fallbackها
        COMPILED=0

        echo "=========================================================="
        echo ">>> [STRATEGY 1]: Clang + Full Optimization + Native Flags"
        echo "=========================================================="
        CC=clang CFLAGS="-O3 -fPIC -Wall -march=native -std=c11" make -B runtime
        if [ $? -eq 0 ]; then
          python3 -m axon.cli examples/mlp.axon -o mlp.bin
          if [ $? -eq 0 ]; then
            echo "✅ Strategy 1 Succeeded!"
            COMPILED=1
          fi
        fi

        if [ $COMPILED -eq 0 ]; then
          echo "=========================================================="
          echo "⚠️ Strategy 1 Failed. Switching to [STRATEGY 2]: Standard GCC Generic"
          echo "=========================================================="
          make clean || true
          CC=gcc CFLAGS="-O2 -fPIC -Wall -std=c11" make -B runtime
          if [ $? -eq 0 ]; then
            python3 -m axon.cli examples/mlp.axon -o mlp.bin
            if [ $? -eq 0 ]; then
              echo "✅ Strategy 2 Succeeded!"
              COMPILED=1
            fi
          fi
        fi

        if [ $COMPILED -eq 0 ]; then
          echo "=========================================================="
          echo "⚠️ Strategy 2 Failed. Switching to [STRATEGY 3]: Safe Mode (No-Opt)"
          echo "=========================================================="
          make clean || true
          CC=gcc CFLAGS="-O1 -fPIC -std=c11" make -B runtime
          python3 -m axon.cli examples/mlp.axon --no-opt -o mlp.bin
          if [ $? -eq 0 ]; then
            echo "✅ Strategy 3 (Safe Mode) Succeeded!"
            COMPILED=1
          fi
        fi

        if [ $COMPILED -eq 0 ]; then
          echo "❌ All compilation strategies failed!"
          exit 1
        fi

        set -e
        chmod +x mlp.bin

    - name: 7. Verify Standalone Binary Execution
      run: |
        echo "Running generated native binary..."
        ./mlp.bin

    - name: 8. Upload Compiled Executable (.bin) as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: axon-standalone-mlp-binary
        path: mlp.bin
        retention-days: 14
        if-no-files-found: error
