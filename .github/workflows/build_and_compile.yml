name: Auto Axon Compiler & Multi-Strategy Builder

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-bake:
    name: Multi-Strategy Fallback Compilation
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install System Toolchain (GCC, Clang, LLVM)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential clang llvm-dev libffi-dev

    - name: 4. Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install llvmlite

    - name: 5. Unpack Repository & Patch llvmlite Deprecation
      run: |
        # اصلاح خودکار تابع منسوخ شده در فایل باندل (در صورت وجود)
        if [ -f "axon_bundle.py" ]; then
          sed -i 's/llvm\.initialize()/pass/g' axon_bundle.py
          echo "Unpacking repository via axon_bundle.py..."
          python3 axon_bundle.py || true
        fi
        # اصلاح در تمام فایل‌های باز شده
        find . -name "llvm_backend.py" -exec sed -i 's/llvm\.initialize()/pass/g' {} +

    - name: 6. Multi-Strategy Compilation & Fallback Engine
      id: compile_step
      run: |
        set +e
        COMPILED=0

        echo ">>> [STRATEGY 1]: Clang + Native Optimization"
        CC=clang CFLAGS="-O3 -fPIC -Wall -march=native -std=c11" make -B runtime
        if [ $? -eq 0 ]; then
          python3 -m axon.cli examples/mlp.axon -o mlp.bin
          if [ $? -eq 0 ]; then
            echo "✅ Strategy 1 Succeeded!"
            COMPILED=1
          fi
        fi

        if [ $COMPILED -eq 0 ]; then
          echo ">>> [STRATEGY 2]: Standard GCC Generic"
          make clean || true
          CC=gcc CFLAGS="-O2 -fPIC -Wall -std=c11" make -B runtime
          if [ $? -eq 0 ]; then
            python3 -m axon.cli examples/mlp.axon -o mlp.bin
            if [ $? -eq 0 ]; then
              echo "✅ Strategy 2 Succeeded!"
              COMPILED=1
            fi
          fi
        fi

        if [ $COMPILED -eq 0 ]; then
          echo ">>> [STRATEGY 3]: Safe Mode (No-Opt)"
          make clean || true
          CC=gcc CFLAGS="-O1 -fPIC -std=c11" make -B runtime
          python3 -m axon.cli examples/mlp.axon --no-opt -o mlp.bin
          if [ $? -eq 0 ]; then
            echo "✅ Strategy 3 Succeeded!"
            COMPILED=1
          fi
        fi

        if [ $COMPILED -eq 0 ]; then
          echo "❌ Compilation failed on all strategies!"
          exit 1
        fi

        set -e
        chmod +x mlp.bin

    - name: 7. Verify Standalone Binary Execution
      run: |
        echo "Running generated standalone binary..."
        ./mlp.bin

    - name: 8. Upload Compiled Executable (.bin) as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: axon-standalone-mlp-binary
        path: mlp.bin
        retention-days: 14
        if-no-files-found: error
